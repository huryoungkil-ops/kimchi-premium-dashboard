name: 김프 이력 백업

# n8n 의 김프 이력을 매시간 받아 backup/data/premium-history/ 에 붙인다.
# 워크플로 정의·매매 기록 백업은 Claude 클라우드 루틴 «김프 n8n 백업»이 따로 한다.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-history
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 김프 이력 받기
        id: export
        run: python3 backup/export_history.py

      - name: 커밋 & push
        run: |
          git config user.name "kimchi-dashboard-bot"
          git config user.email "actions@kimchi-premium-dashboard.local"
          git add backup/data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "n8n 백업: 김프 이력 ${{ steps.export.outputs.rows }}행 추가 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # 대시보드 갱신·루틴 백업이 그 사이에 올렸을 수 있다
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 10
          done
          exit 1
